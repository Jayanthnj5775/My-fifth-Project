apiVersion: v1
kind: Pod
metadata:
  name: python-app-pod
  labels:
    app: python-api
spec:
  containers:
    - name: flask-container
      image: jayanthnj/python-cicd-api:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5000
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "250m"
